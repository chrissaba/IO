                - text: "]"
            - list [ref=f8e207]:
              - listitem [ref=f8e208]: Tap the 4 dots menu then the Cloud icon. Ensure that you are signed into the Checkbox Account system to avoid losing your save.
              - listitem [ref=f8e209]:
                - text: Enter all
                - link "Codes" [ref=f8e210] [cursor=pointer]:
                  - /url: /wiki/Codes
                - text: . Gifts get better with higher Obelisk level. Stickers unlock at Obelisk 3. Star buffs unlock at Obelisk 30.
              - listitem [ref=f8e211]:
                - text: Follow the Guide "
                - link "How should I spend my Gems?" [ref=f8e212] [cursor=pointer]:
                  - /url: /wiki/Guides/Gem_Spending_Guide
                - text: "\"."
              - listitem [ref=f8e213]:
                - text: Claim the Freebie Pack in the Store as often as you can. Freebies will be your biggest source of gems in the early game and the Treasure Hunter skill will turn it into your main source of
                - link "Relic Chests" [ref=f8e214] [cursor=pointer]:
                  - /url: /wiki/Chests#Relic_Chests
                - text: for the entire game. (Buy the banked freebie cap increase in store for Freebie Packs).
              - listitem [ref=f8e215]:
                - text: You unlock
                - link "Cards" [ref=f8e216] [cursor=pointer]:
                  - /url: /wiki/Cards
                - text: at Obelisk 15. There are a few impactful
                - link "Misc Cards" [ref=f8e217] [cursor=pointer]:
                  - /url: /wiki/Cards#Misc_card_odds
                - text: you can get immediately.
            - generic [ref=f8e218]:
              - heading "World 1" [level=2] [ref=f8e219]
              - generic [ref=f8e221]:
                - text: "["
                - link "edit" [ref=f8e222] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=2
                - text: "|"
                - link "edit source" [ref=f8e223] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=2
                - text: "]"
            - generic [ref=f8e224]:
              - heading "Obelisk 0 to Obelisk 9" [level=3] [ref=f8e225]
              - generic [ref=f8e227]:
                - text: "["
                - link "edit" [ref=f8e228] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=3
                - text: "|"
                - link "edit source" [ref=f8e229] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=3
                - text: "]"
            - list [ref=f8e230]:
              - listitem [ref=f8e231]:
                - text: Unlock the bombs in the
                - link "Workshop" [ref=f8e232] [cursor=pointer]:
                  - /url: /wiki/Workshop
                - text: and buy the Battery Bomb from the store. Fire Cherry bomb then use the charges on Battery bomb.
              - listitem [ref=f8e233]:
                - text: You unlock
                - link "Challenges" [ref=f8e234] [cursor=pointer]:
                  - /url: /wiki/Challenges
                - text: at Obelisk 10. Work on them whenever you can and always buy the bottom upgrade in the list so you can get to the best upgrades at the bottom. But if they are too hard it's good to focus on other areas of the game and come back to them later.
            - generic [ref=f8e235]:
              - heading "Obelisk 10 to Obelisk 19" [level=3] [ref=f8e236]
              - generic [ref=f8e238]:
                - text: "["
                - link "edit" [ref=f8e239] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=4
                - text: "|"
                - link "edit source" [ref=f8e240] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=4
                - text: "]"
            - list [ref=f8e241]:
              - listitem [ref=f8e242]:
                - text: At first you will still be progressing through obelisks easily. When you start to slow down, take a break to work on
                - link "Prestige" [ref=f8e243] [cursor=pointer]:
                  - /url: /wiki/Prestige
                - text: and
                - link "Challenges" [ref=f8e244] [cursor=pointer]:
                  - /url: /wiki/Challenges
                - text: .
              - listitem [ref=f8e245]:
                - text: People often feel like they have spare gems at this point and spend them on skill points for the
                - link "Skill-Tree" [ref=f8e246] [cursor=pointer]:
                  - /url: /wiki/Skill-Tree
                - text: . But it is very expensive for not much benefit. You will be able to make more progress saving them for Pets and Statues.
              - listitem [ref=f8e247]:
                - text: At Obelisk 15 you unlock
                - link "Cards" [ref=f8e248] [cursor=pointer]:
                  - /url: /wiki/Cards
                - text: . You can easily get a few cards by using all your bombs, but ore and bar cards will take too long for now. It is worth gilding Cherry, Battery, D20 and Gem bomb cards when you can. Check out
                - link "Misc Cards" [ref=f8e249] [cursor=pointer]:
                  - /url: /wiki/Cards#Misc_card_odds
                - text: ", there are several cards you can obtain immediately that provide good bonuses."
              - listitem [ref=f8e250]:
                - text: If you're struggling to reach Obelisk 17, work on
                - link "Prestige" [ref=f8e251] [cursor=pointer]:
                  - /url: /wiki/Prestige
                - text: ", the Pickaxe Damage upgrade in the"
                - link "Store" [ref=f8e252] [cursor=pointer]:
                  - /url: /wiki/Store
                - text: ","
                - link "Upgrades" [ref=f8e253] [cursor=pointer]:
                  - /url: /wiki/Upgrades
                - text: and
                - link "Contracts" [ref=f8e254] [cursor=pointer]:
                  - /url: /wiki/Contracts
                - text: .
              - listitem [ref=f8e255]:
                - text: At Obelisk 17 you unlock
                - link "Pets" [ref=f8e256] [cursor=pointer]:
                  - /url: /wiki/Pets
                - text: . You can easily level the Crab pet by equipping the bear drone suit. Buy pets as soon as you can. Some take a long time to level, but Total Pet Level is required to unlock later pets.
              - listitem [ref=f8e257]:
                - text: At Obelisk 18 you unlock
                - link "Drone Fuel" [ref=f8e258] [cursor=pointer]:
                  - /url: /wiki/Drones#Drone_Fuel
                - text: . To use drone fuel efficiently it's important to buy all the coal upgrades before fueling drones. It will take a long time to do this, so spend a few gems on generator upgrades when you can. You'll have enough max coal for now when your generator is level 16 and you have the Gasoline Guzzler skill.
              - listitem [ref=f8e259]:
                - text: "If you're struggling to reach Obelisk 19, make sure to do the following:"
                - list [ref=f8e260]:
                  - listitem [ref=f8e261]: Max Pickaxe Damage in the Store
                  - listitem [ref=f8e262]: Level up Dwarf Pet
                  - listitem [ref=f8e263]: Max Obelisk Armor Reduction from Prestige Tier 3
                  - listitem [ref=f8e264]: Get Obelisk Armor Reduction from Challenges
                  - listitem [ref=f8e265]: Spend some time buying Upgrades
                  - listitem [ref=f8e266]: Spend some time doing Contracts
            - paragraph [ref=f8e267]
            - generic [ref=f8e268]:
              - heading [level=3] [ref=f8e269]:
                - generic [ref=f8e270]:
                  - link "Construct" [ref=f8e271] [cursor=pointer]:
                    - /url: /wiki/Construct
                  - text: (World 1)
              - generic [ref=f8e272]:
                - text: "["
                - link "edit" [ref=f8e273] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=5
                - text: "|"
                - link "edit source" [ref=f8e274] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=5
                - text: "]"
            - list [ref=f8e275]:
              - listitem [ref=f8e276]:
                - text: At Obelisk 19 you unlock
                - link "Construct" [ref=f8e277] [cursor=pointer]:
                  - /url: /wiki/Construct
                - text: ". This is the first major wall in the game, it's normal to feel like the game slows down at this point. The focus should be less on beating obelisks and more on filling out progress in all the menus you've unlocked so far. As you unlock veins and build statues you will start to get ore and bar cards. You should gild them if you're going to be waiting for bars longer than gems. Gild ore cards first: this increases the amount of gold you get and they are needed for a challenge. It is generally not worth rushing to unlock World 2. It is much harder than World 1 and people who unlock it too soon often return to World 1 without much to show for it. The two major reasons to unlock World 2 early are rewards from the event doubling (except for gifts and mythic chests) and unlocking bomb damage and vein spawn rate contracts."
              - listitem [ref=f8e278]:
                - text: "Here are the main ways you can increase your bar income:"
                - list [ref=f8e279]:
                  - listitem [ref=f8e280]: Unlock the Penguin Pet
                  - listitem [ref=f8e281]: Continue to claim the Freebie Pack with the Treasure Hunter skill to get more Relic Chests
                  - listitem [ref=f8e282]: Unlock and upgrade the Transmuter Bomb in the workshop
                  - listitem [ref=f8e283]:
                    - text: Combine the buffs from Transmuter and Bomb of Plenty, see
                    - 'link "FAQ: Best ways to get bars?" [ref=f8e284] [cursor=pointer]':
                      - /url: /wiki/Obelisk:FAQ#What_is_the_best_way_to_get_bars?
                    - text: (Optional)
              - listitem [ref=f8e285]: You'll need to unlock the Stone Vein from the research tab in the construct menu before you can see the other 2 tabs.
              - listitem [ref=f8e286]: You should follow the recommendations before you build the World 2 monument. But you can stop at challenge 39 and wait until you have coal upgrades maxed.
              - listitem [ref=f8e287]: Work on unlocking veins and building statues.
              - listitem [ref=f8e288]: The 2x Vein Spawn Rate research can be useful if you are waiting for veins longer than gems, but are not a mandatory purchase.
              - listitem [ref=f8e289]: After you have built all 9 statues, you could gild them before going to World 2, but the World 2 contract upgrades and early regular upgrades significantly increase vein gain, thus making gilding statues after building the World 2 monument a lot easier.
            - generic [ref=f8e290]:
              - heading "World 2" [level=2] [ref=f8e291]
              - generic [ref=f8e293]:
                - text: "["
                - link "edit" [ref=f8e294] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=6
                - text: "|"
                - link "edit source" [ref=f8e295] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=6
                - text: "]"
            - list [ref=f8e296]:
              - listitem [ref=f8e297]: After you've built 9 statues and have 39 challenges done you can go to world 2 by building the monument in the Monument tab of the Construct menu. It costs 2,000 gems plus some veins, so it's not recommended to build it before this point as you still have a lot you should do in world 1.
              - listitem [ref=f8e298]: You unlock some good contracts but you may not have enough points to get very many of them yet.
              - listitem [ref=f8e299]: You can get some bomb damage from the workshop to help beat world 2 ores.
            - generic [ref=f8e300]:
              - heading [level=3] [ref=f8e301]:
                - generic [ref=f8e302]:
                  - link "Construct" [ref=f8e303] [cursor=pointer]:
                    - /url: /wiki/Construct
                  - text: (World 2), Gilded Statues
              - generic [ref=f8e304]:
                - text: "["
                - link "edit" [ref=f8e305] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=7
                - text: "|"
                - link "edit source" [ref=f8e306] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=7
                - text: "]"
            - list [ref=f8e307]:
              - listitem [ref=f8e308]: If you didn't already, gild all 9 statues.
              - listitem [ref=f8e309]: Continue working on pets, with the goal of unlocking Pet 8.
              - listitem [ref=f8e310]: You will unlock Stargazing at Obelisk 23, but it's best to gild all statues first to give you time to get your Vein Spawn Rate up through Prestige tier 4, gilded Statue of Randomness and Pet 8. You can work on it a little when you get a free buff from lootbugs.
            - generic [ref=f8e311]:
              - heading [level=3] [ref=f8e312]:
                - generic [ref=f8e313]:
                  - link "Stargazing" [ref=f8e314] [cursor=pointer]:
                    - /url: /wiki/Stargazing
                  - text: (World 2)
              - generic [ref=f8e315]:
                - text: "["
                - link "edit" [ref=f8e316] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=8
                - text: "|"
                - link "edit source" [ref=f8e317] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=8
                - text: "]"
            - list [ref=f8e318]:
              - listitem [ref=f8e319]: The first thing to do is unlock a star. Upgrade the telescope in the Upgrades tab, then unlock the star at the top of the Stars menu. After you unlock it you will be able to see which floor it is on in the Stars tab or on the floor select menu. Stars will move to one of 5 preset locations at x:00 and x:30 on your device's clock.
              - listitem [ref=f8e320]:
                - text: "When you first start stargazing your only source of Auto-Catch will be from lootbug buffs. This means stars will fly across the screen without being caught unless you manually tap them. There are 3 ways to make progress at this stage:"
                - list [ref=f8e321]:
                  - listitem [ref=f8e322]: Manually tap stars
                  - listitem [ref=f8e323]: Collect Veins and upgrade Auto-Catch in the Upgrades tab
                  - listitem [ref=f8e324]: Fuel Starburst drone for 100% Auto-Catch (doesn't count for offline gains)
              - listitem [ref=f8e325]: You will still need to change floors when the stars move every 30 minutes, but you can automate this by unlocking 'Ctrl+F Stars' in the Skill-Tree.
              - listitem [ref=f8e326]: For the Upgrades tab you should focus on Auto-Catch and Star Spawn Rate. Star spawn rate also increases the amount of Super Stars you get. The main barrier to progress in Upgrades will be Super Stars, you need these for several levels in each Upgrade. It's best to avoid spending them in the Super Stars tab until you've bought all the Upgrades that need them.
              - listitem [ref=f8e327]: To make efficient progress in Stargazing you should work on Upgrades and focus on stars that increase star gain such as Taurus, Gemini, Virgo and Scorpio. Other stars that provide some indirect benefit to star gain are Cancer, Libra and Sagittarius.
              - listitem [ref=f8e328]: The main goal in Stargazing is to upgrade the 12th Star. It will help you unlock the 10th pet.
            - generic [ref=f8e329]:
              - heading [level=3] [ref=f8e330]:
                - generic [ref=f8e331]:
                  - link "Archaeology" [ref=f8e332] [cursor=pointer]:
                    - /url: /wiki/Archaeology
                  - text: (World 2)
              - generic [ref=f8e333]:
                - text: "["
                - link "edit" [ref=f8e334] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=9
