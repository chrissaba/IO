                  - listitem [ref=f8e410]: Unlocks veins and progress in the first three zone.
                  - listitem [ref=f8e411]:
                    - text: If the game feels hard, don't forget the
                    - link "Workshop" [ref=f8e412] [cursor=pointer]:
                      - /url: /wiki/Workshop
                    - text: upgrades, and new
                    - link "Omega Chances" [ref=f8e413] [cursor=pointer]:
                      - /url: /wiki/Omega_Chances?action=edit&redlink=1
                    - text: ","
                    - link "Pickaxe Damage" [ref=f8e414] [cursor=pointer]:
