            - list [ref=f8e451]:
              - listitem [ref=f8e452]:
                - text: This step generally requires doing two statues, then farming something else before doing two more statues, and so on.
                - list [ref=f8e453]:
                  - listitem [ref=f8e454]:
                    - text: Start getting all first three legendary fish in Tribute 1, Rainbow Trout in Tribute 2, and unlock all Dock 1 legendary fishes.
                    - list [ref=f8e455]:
                      - listitem [ref=f8e456]: Keep your drones on the first three docks, so you'll get enough of those docks' last fish to tribute
                  - listitem [ref=f8e457]: Don't forget your stars, you'll quickly unlock some new level so you'll have to keep the pace on these too.
                  - listitem [ref=f8e458]:
                    - text: Between 8th gilded Statue and 3rd plat Statue, unlock Blackhole.
                    - list [ref=f8e459]:
                      - listitem [ref=f8e460]:
                        - text: When Blackhole is unlocked, follow the required stars and veins and unlock
                        - link "Lootfrogs" [ref=f8e461] [cursor=pointer]:
                          - /url: /wiki/Lootfrogs
                        - text: . If you usually use Frogger Drone, this would be very efficient.
