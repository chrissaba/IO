                - text: "|"
                - link "edit source" [ref=f8e389] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=12
                - text: "]"
            - list [ref=f8e390]:
              - listitem [ref=f8e391]: Don't rush it. There is time for everything. That said, you probably have everything you need for it (except the gems) just from getting platinum statues, or close.
              - listitem [ref=f8e392]: Similar to W2 versus W1, the W3 ores are much stronger than W2, so you won't be able to make much progress for a while if you open it early. Also, the global -30% game speed debuff in W3 makes it bad to idle in (due to slowing down bomb recharge).
              - listitem [ref=f8e393]: There are useful upgrades you can get from mining in the early W3 stages, so just monitor your speed in gaining the needed W3 resource and skip it if it will take several days.
