                    - text: are unlockable in the
                    - link "Contracts" [ref=f8e416] [cursor=pointer]:
                      - /url: /wiki/Contracts
                    - text: .
              - listitem [ref=f8e417]:
                - text: Buy
                - link "\"Please Sir Don't Make Me Prestige Again\" skill" [ref=f8e418] [cursor=pointer]:
                  - /url: /wiki/Skill-Tree#PleaseSirDontMakeMePrestigeAgain
                - text: to get new Contracts re-spec.
                - list [ref=f8e419]:
                  - listitem [ref=f8e420]: "Reminder: a Re-spec removes ALL current contracts upgrades and gives you back all the contracts points for free, but they are limited in number."
