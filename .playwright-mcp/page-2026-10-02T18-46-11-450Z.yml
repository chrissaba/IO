            - list [ref=f8e336]:
              - listitem [ref=f8e337]:
                - text: For a more in depth info about the menu see
                - link "Archaeology" [ref=f8e338] [cursor=pointer]:
                  - /url: /wiki/Archaeology
                - text: .
              - listitem [ref=f8e339]: When you first unlock Archaeology, you shouldn't spend many gems on it. You will have other things that give more immediate gains for less gems. The ultimate goal in Archaeology is to max out the Idols which give buffs to the main game. Maxing these Idols takes a long time, so it's best to buy all the Upgrades first to increase how fast you gain fragments.
              - listitem [ref=f8e340]: Your main goal initially, after buying all the Upgrades that need epic fragments, is to max Dionysus. Dionysus provides very strong buffs to drones. Dionysus' quest requires grade 15 void drone. You can get 15 void drone grade cap either by gilding the card or getting some levels in Nyx, the legendary Idol. Nyx requires level 20 generator, but you'll need level 20 generator to take full advantage of the buffs from Dionysus.
              - listitem [ref=f8e341]: There are several other Idols that provide strong buffs. Buy some gem purchases for Archaeology when you feel like your other gem spending options are under control.
            - generic [ref=f8e342]:
              - heading "Plat W1 Statue" [level=3] [ref=f8e343]
              - generic [ref=f8e345]:
                - text: "["
                - link "edit" [ref=f8e346] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=10
                - text: "|"
                - link "edit source" [ref=f8e347] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=10
                - text: "]"
            - list [ref=f8e348]:
              - listitem [ref=f8e349]: Unlock Polychrome cards from the Skill-Tree.
              - listitem [ref=f8e350]: Gild all ore and bar cards up through floor 60.
              - listitem [ref=f8e351]: Equip and fuel Void and Chain drones.
              - listitem [ref=f8e352]: Auto fire Bomb of Plenty on floor 60.
              - listitem [ref=f8e353]: Pause drones so bombs hit.
            - list [ref=f8e354]:
              - listitem [ref=f8e355]:
                - text: When Plat is done, focus on unlocking
                - link "Fishing" [ref=f8e356] [cursor=pointer]:
                  - /url: /wiki/Fishing
                - text: and farming everything.
            - paragraph [ref=f8e357]
            - generic [ref=f8e358]:
              - heading [level=3] [ref=f8e359]:
                - generic [ref=f8e360]:
                  - link "Fishing" [ref=f8e361] [cursor=pointer]:
                    - /url: /wiki/Fishing
                  - text: (World 2)
              - generic [ref=f8e362]:
                - text: "["
                - link "edit" [ref=f8e363] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?veaction=edit&section=11
                - text: "|"
                - link "edit source" [ref=f8e364] [cursor=pointer]:
                  - /url: /wiki/Guides/Progression_Guide?action=edit&section=11
                - text: "]"
            - list [ref=f8e365]:
              - listitem [ref=f8e366]: You'll have to start slowly. Focus on getting all upgrades on dock 1, and gild all fish cards as you progress.
              - listitem [ref=f8e367]: Repeat until at least unlocking dock 4.
              - listitem [ref=f8e368]:
                - text: "Then, you can choose between two methods:"
                - list [ref=f8e369]:
                  - listitem [ref=f8e370]:
                    - text: "\"Slow\" method: if you don't have the Poseidon Idol maxed, DO NOT choose this way."
                    - list [ref=f8e371]:
                      - listitem [ref=f8e372]: Go back to dock 1 to poly Guppy. This unlocks Poseidon Idols' huge +166% drone fishing power improvement.
                      - listitem [ref=f8e373]:
                        - text: Unlock the
                        - link "Skill \"Fishing With Friends\"" [ref=f8e374] [cursor=pointer]:
                          - /url: /wiki/Skill-Tree#FishingWithFriends
                        - text: and max it (level 3).
                      - listitem [ref=f8e375]: You can continue with the "quick but expensive" method with improved stats, speeding up your fishing progress.
                  - listitem [ref=f8e376]:
                    - text: "\"Quick but expensive\" method: Follow this method if you can't do the slow version because you rushed in."
                    - list [ref=f8e377]:
                      - listitem [ref=f8e378]: Start dock 4 and continue improving upgrades and cards. It'll become expensive quickly.
                      - listitem [ref=f8e379]:
                        - text: Unlock the
                        - link "Skill \"With This Fish I Summon Two More Fish\"" [ref=f8e380] [cursor=pointer]:
                          - /url: /wiki/Skill-Tree#WithThisFishISummonTwoMoreFish
                        - text: and max it (level 3).
                      - listitem [ref=f8e381]: At the end of Tier 1, if not done yet, don't forget to poly Guppy.
              - listitem [ref=f8e382]: When all upgrades are done, go to Notice page and turn in fish for maingame boosts.
            - generic [ref=f8e383]:
              - heading [level=3] [ref=f8e384]:
                - link "World 3 Monument" [ref=f8e386] [cursor=pointer]:
                  - /url: /wiki/Construct#Monuments
              - generic [ref=f8e387]:
                - text: "["
                - link "edit" [ref=f8e388] [cursor=pointer]:
