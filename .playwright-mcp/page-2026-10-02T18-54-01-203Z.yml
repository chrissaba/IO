                    - link "Bombs":
                      - /url: /wiki/Bombs
              - generic [ref=f34e204]:
                - text: Bombs are another source of damage and can help with progressing through the floors. Certain bombs also provide secondary effects like giving more Ores, more Exp or providing free Gems. After buying the
                - link "Auto-Bomber" [ref=f34e205] [cursor=pointer]:
                  - /url: /wiki/Skill-Tree#AutoBomb
                - text: skill, bombs can also be automatically fired which makes them another way of passively dealing damage. Bombs do not work on
                - link "Obelisk" [ref=f34e206] [cursor=pointer]:
                  - /url: /wiki/Obelisk
                - text: and they deal no damage to it.
