                  - cell [ref=f34e264]:
                    - text: Fires a bomb every 1.25 seconds. This allows you to combine transmuter with another bomb being fired by Auto-Bomber. See
                    - link "This section in the FAQ" [ref=f34e265] [cursor=pointer]:
